<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel="stylesheet" href="file-browser.css">
</head>
<body>
<div class='shell'>
  <aside class='sidebar panel'>
    <div class='sidebar-section'>
      <div class='sidebar-title-row'>
        <span class='sidebar-title'>已连接 App</span>
        <button id='reloadAppsBtn' class='secondary'>刷新</button>
      </div>
      <div id='appTabs' class='app-list'></div>
    </div>
    <div class='sidebar-section'>
      <span class='sidebar-title'>常用位置</span>
      <div class='places-list'>
        <button id='rootBtn' class='nav-item'><span class='nav-icon'>⌂</span><span><span class='nav-label'>根目录</span><span class='nav-hint'>Sandbox root</span></span></button>
        <button id='documentsBtn' class='nav-item'><span class='nav-icon'>D</span><span><span class='nav-label'>Documents</span><span class='nav-hint'>用户文档</span></span></button>
        <button id='libraryBtn' class='nav-item'><span class='nav-icon'>L</span><span><span class='nav-label'>Library</span><span class='nav-hint'>支持文件与缓存</span></span></button>
        <button id='tmpBtn' class='nav-item'><span class='nav-icon'>T</span><span><span class='nav-label'>tmp</span><span class='nav-hint'>临时文件</span></span></button>
      </div>
    </div>
    <div class='sidebar-foot'>
      <span>USB 沙盒浏览器</span>
      <strong id='sidebarStatus'>未选择 App</strong>
    </div>
  </aside>
  <main class='content'>
    <section class='panel header'>
      <div><div class='eyebrow'>Lookin File Browser</div><h1>iOS 沙盒文件</h1></div>
      <div class='header-meta'><span id='selectionBadge' class='status-badge'>未选择 App</span><span id='statusText' class='status-text'>选择左侧 USB App 后开始浏览。</span></div>
    </section>
    <section class='panel context-strip'>
      <div class='context-item'>
        <span>目标 App</span>
        <strong id='targetAppName'>未选择</strong>
        <small id='targetDeviceName'>USB 设备</small>
      </div>
      <div class='context-item'>
        <span>当前目录</span>
        <strong id='currentPathSummary' class='mono'>/</strong>
        <small id='currentFolderSummary'>根目录</small>
      </div>
      <div class='context-item'>
        <span>选中项</span>
        <strong id='selectedItemSummary'>无</strong>
        <small id='selectedItemPath' class='mono'>未选择</small>
      </div>
    </section>
    <section class='panel path-panel'>
      <div class='section-heading'><span>路径</span></div>
      <div id='breadcrumbs' class='breadcrumbs'></div>
      <div class='path-bar'>
        <label class='field grow'>
          <span>沙盒相对路径</span>
          <input id='pathInput' class='mono' placeholder='例如 Documents 或 Library/Caches'>
        </label>
        <button id='openPathBtn' class='secondary'>打开</button>
        <button id='upBtn' class='secondary'>上一级</button>
        <button id='refreshBtn' class='secondary'>刷新</button>
      </div>
    </section>
    <section class='panel browser-tools'>
      <div class='section-heading'><span>查看</span></div>
      <div class='browser-tools-row'>
        <label class='field grow'>
          <span>搜索当前目录</span>
          <input id='searchInput' placeholder='文件名、路径或类型'>
        </label>
        <select id='sortSelect'>
          <option value='kind-name'>文件夹优先</option>
          <option value='name-asc'>名称 A-Z</option>
          <option value='name-desc'>名称 Z-A</option>
          <option value='size-desc'>大小从大到小</option>
          <option value='size-asc'>大小从小到大</option>
        </select>
        <div class='view-switch'>
          <button id='listViewBtn' class='secondary active-toggle'>列表</button>
          <button id='gridViewBtn' class='secondary'>网格</button>
        </div>
      </div>
    </section>
    <section class='panel transfer-panel'>
      <div class='section-heading'><span>操作</span></div>
      <div class='operation-grid'>
        <div class='operation-group'>
          <div class='operation-title'>当前目录</div>
          <div class='inline-action'>
            <label class='field grow'>
              <span>新文件夹名称</span>
              <input id='newFolderInput' placeholder='例如 Exports'>
            </label>
            <button id='newFolderBtn' class='secondary'>创建文件夹</button>
          </div>
        </div>
        <div class='operation-group operation-group-wide'>
          <div class='operation-title'>写入到 iOS 沙盒</div>
          <div class='inline-action'>
            <button id='uploadBtn'>从 Mac 上传文件</button>
            <label class='field grow'>
              <span>文件 URL</span>
              <input id='sourceUrlInput' class='mono' placeholder='http://localhost:3335/templates/XJI-Chat.xji'>
            </label>
            <button id='importUrlBtn' class='secondary'>从 URL 导入</button>
          </div>
        </div>
        <div class='operation-group'>
          <div class='operation-title'>选中项</div>
          <div class='selection-actions'>
            <button id='downloadBtn' class='secondary'>下载到 Mac</button>
            <button id='deleteBtn' class='danger'>删除选中项</button>
          </div>
        </div>
      </div>
    </section>
    <section class='panel file-panel'>
      <div class='list-header'><div class='list-title'><strong id='currentFolderName'>Root</strong><span id='footerCount' class='muted'>0 items</span></div><span id='footerPath' class='mono muted'>/</span></div>
      <div class='table-wrap'>
        <table id='entriesTable'>
          <colgroup><col class='name-col'><col class='kind-col'><col class='size-col'><col class='path-col'></colgroup>
          <thead><tr><th>Name</th><th>Kind</th><th>Size</th><th>Path</th></tr></thead>
          <tbody id='entriesBody'></tbody>
        </table>
        <div id='gridBody' class='grid-wrap hidden'></div>
        <div id='emptyState' class='empty-state' hidden></div>
      </div>
    </section>
  </main>
  <aside class='inspector panel'><div class='inspector-section'><span class='section-title'>详情</span><div id='detailsCard' class='details-card'></div></div></aside>
</div>
<script src="file-browser.js"></script>
</body>
</html>
